<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="Happy New Year 2025!">
    <meta property="og:description" content="Wishing you a joyful and successful new year! 🎉">
    <meta property="og:image" content="hhttp://127.0.0.1:5500/newyear.html">
    <meta property="og:url" content="http://127.0.0.1:5500/newyear.html">
    <title>Happy New Year</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b132b, #3a506b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .greeting-box {
            width: 600px;
            padding: 40px;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 30px rgba(91, 192, 190, 0.3),
                0 0 50px rgba(255, 42, 109, 0.2);
            border-radius: 10px;
            border: 1px solid rgba(91, 192, 190, 0.3);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 400px;
        }

        .greeting-box h2 {
            margin: 0 0 30px;
            padding: 0;
            color: #5bc0be;
            text-align: center;
            font-size: 28px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(91, 192, 190, 0.7);
        }

        .greeting-message {
            text-align: center;
            color: #fff;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            position: relative;
        }

        .author {
            position: absolute;
            bottom: -30px;
            right: 0;
            font-size: 14px;
            color: #ff2a6d;
            text-shadow: 0 0 5px rgba(255, 42, 109, 0.5);
            font-style: italic;
        }

        button {
            position: relative;
            display: inline-block;
            padding: 12px 30px;
            color: #fff;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            overflow: hidden;
            transition: 0.5s;
            margin-top: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #ff2a6d;
            color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 5px #ff2a6d,
                0 0 25px #ff2a6d,
                0 0 50px #ff2a6d,
                0 0 100px #ff2a6d;
        }

        button span {
            position: absolute;
            display: block;
        }

        button span:nth-child(1) {
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff2a6d);
            animation: btn-anim1 1.5s linear infinite;
        }

        @keyframes btn-anim1 {
            0% {
                left: -100%;
            }

            50%,
            100% {
                left: 100%;
            }
        }

        button span:nth-child(2) {
            top: -100%;
            right: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg, transparent, #05d9e8);
            animation: btn-anim2 1.5s linear infinite;
            animation-delay: 0.375s;
        }

        @keyframes btn-anim2 {
            0% {
                top: -100%;
            }

            50%,
            100% {
                top: 100%;
            }
        }

        button span:nth-child(3) {
            bottom: 0;
            right: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(270deg, transparent, #05d9e8);
            animation: btn-anim3 1.5s linear infinite;
            animation-delay: 0.75s;
        }

        @keyframes btn-anim3 {
            0% {
                right: -100%;
            }

            50%,
            100% {
                right: 100%;
            }
        }

        button span:nth-child(4) {
            bottom: -100%;
            left: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(360deg, transparent, #ff2a6d);
            animation: btn-anim4 1.5s linear infinite;
            animation-delay: 1.125s;
        }

        @keyframes btn-anim4 {
            0% {
                bottom: -100%;
            }

            50%,
            100% {
                bottom: 100%;
            }
        }

        /* Background effects */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(#05d9e81a 1px, transparent 1px),
                linear-gradient(90deg, #05d9e81a 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }

        .neon-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: 0;
        }

        .circle1 {
            background: #ff2a6d;
            width: 300px;
            height: 300px;
            top: 20%;
            left: 15%;
            animation: float 8s ease-in-out infinite;
        }

        .circle2 {
            background: #05d9e8;
            width: 400px;
            height: 400px;
            bottom: 10%;
            right: 10%;
            animation: float 10s ease-in-out infinite;
        }

        .circle3 {
            background: #7d61ff;
            width: 250px;
            height: 250px;
            bottom: 30%;
            left: 10%;
            animation: float 9s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translatey(0px);
            }

            50% {
                transform: translatey(-20px);
            }

            100% {
                transform: translatey(0px);
            }
        }

        /* Import Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

        /* Fireworks Container */
        #fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* Individual firework particle */
        .firework-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    <div class="neon-circle circle1"></div>
    <div class="neon-circle circle2"></div>
    <div class="neon-circle circle3"></div>

    <div id="fireworks-container"></div>

    <div class="greeting-box">
        <h2>ලැබුවා වූ සිංහල හා හින්දු අලුත් අවුරුද්ද සුභම සුභ නව වසරක් වේවා ! <br>🎉🎊! </h2>
        <div class="greeting-message">
            ලැබූ නව වසරේ ඔබගේ සහ ඔබේ පවුලේ සියලු සිතුම් පැතුම් ඉටු වී, සතුටින්, සෞඛ්‍යයෙන් හා සාර්ථකත්වයෙන් පිරුණු
            <br><br>
            <strong>සුභම සුභ නව වසරක් වේවා! 🌸🌞</strong> 🌟✨
            <div class="author">wished by ~Charaka Hashan~</div>
        </div>
        <button id="celebrate-btn">
            <span></span><span></span><span></span><span></span>
            Celebrate
        </button>
    </div>

    <script>
        // Fireworks functionality
        const fireworksContainer = document.getElementById('fireworks-container');
        const celebrateBtn = document.getElementById('celebrate-btn');

        // Colors for fireworks
        const colors = [
            '#ff2a6d', '#05d9e8', '#7d61ff', '#ffbe0b',
            '#fb5607', '#8338ec', '#3a86ff', '#00f5d4',
            '#fee440', '#00bbf9', '#f15bb5'
        ];

        // Function to create a firework
        function createFirework(x, y) {
            const particleCount = 150;
            const angleIncrement = (Math.PI * 2) / particleCount;
            const fireworkColor = colors[Math.floor(Math.random() * colors.length)];

            // Create particles for this firework
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('firework-particle');

                // Random parameters
                const angle = angleIncrement * i;
                const velocity = 2 + Math.random() * 3;
                const size = 2 + Math.random() * 3;
                const lifetime = 1000 + Math.random() * 1000; // 1-2 seconds

                // Initial position
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.backgroundColor = fireworkColor;

                // Add to container
                fireworksContainer.appendChild(particle);

                // Animation parameters
                const dx = Math.cos(angle) * velocity;
                const dy = Math.sin(angle) * velocity;
                let opacity = 1;
                let posX = x;
                let posY = y;

                // Animate the particle
                const startTime = Date.now();

                function animate() {
                    const elapsed = Date.now() - startTime;
                    const progress = elapsed / lifetime;

                    if (progress >= 1) {
                        particle.remove();
                        return;
                    }

                    // Update position with gravity
                    posX += dx;
                    posY += dy + progress * 0.5; // Gravity effect

                    // Update opacity
                    opacity = 1 - progress;

                    // Apply styles
                    particle.style.left = posX + 'px';
                    particle.style.top = posY + 'px';
                    particle.style.opacity = opacity;

                    requestAnimationFrame(animate);
                }

                requestAnimationFrame(animate);
            }
        }

        // Function to launch multiple fireworks
        function launchFireworks() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            // Launch multiple fireworks in sequence
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const x = Math.random() * windowWidth;
                    const y = Math.random() * (windowHeight * 0.6); // Keep in upper 60% of screen
                    createFirework(x, y);
                }, i * 300); // Launch a new firework every 300ms
            }

            // Play celebration sound (optional)
            const audio = new Audio('data:audio/mp3;base64,SUQzBAAAAAACM1RZRVIAAAAGAAAAMjAyMwBUREFUAAAABgAAADIwMjMAVFBFMQAAAAYAAABCZWVwAABYTUwAAAAAEAAAADxzZWU+PCwwPjwvPgA=');
            audio.volume = 0.3;
            audio.play().catch(e => console.log('Audio play failed:', e));

            // Show celebration message
            /* Swal.fire({
                title: 'Happy New Year!',
                text: 'Wishing you joy and prosperity!',
                icon: 'success',
                background: 'rgba(15, 23, 42, 0.9)',
                color: '#fff',
                confirmButtonColor: '#ff2a6d',
                timer: 3000,
                timerProgressBar: true,
                showConfirmButton: false
            }); */
        }

        // Add click event to the celebrate button
        celebrateBtn.addEventListener('click', () => {
            launchFireworks();

            // Continue launching fireworks periodically
            const interval = setInterval(() => {
                if (document.hidden) {
                    clearInterval(interval);
                    return;
                }
                launchFireworks();
            }, 5000); // Launch new batch every 5 seconds

            // Clear interval after 30 seconds
            setTimeout(() => {
                clearInterval(interval);
            }, 30000);
        });
    </script>
</body>

</html>
